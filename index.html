<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>MakeMyResume - Create & Download Resume</title>

  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>

  <!-- React & React DOM via CDN -->
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  
  <!-- Babel for JSX in browser -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <!-- Razorpay Checkout Script -->
  <script src="https://checkout.razorpay.com/v1/checkout.js"></script>

  <!-- HTML2PDF for PDF Download -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
</head>
<body class="bg-slate-50 text-slate-800 font-sans">

  <div id="root"></div>

  <!-- Main Application Script -->
  <script type="text/babel">
    const { useState } = React;

    function App() {
      // Navigation & Page State
      const [currentPage, setCurrentPage] = useState('home'); // 'home', 'editor', 'admin'
      
      // Dynamic Admin Pricing State
      const [pricing, setPricing] = useState({
        free: 0,
        premium: 5,
        pro: 49
      });

      // Admin Stats & Users State
      const [stats, setStats] = useState({
        totalUsers: 12,
        totalDownloads: 45,
        totalRevenue: 225
      });

      const [users, setUsers] = useState([
        { id: 1, name: "Ankit Verma", email: "ankit@gmail.com", phone: "+91 9876543210", downloads: 3 },
        { id: 2, name: "Priya Singh", email: "priya@gmail.com", phone: "+91 9123456789", downloads: 5 }
      ]);

      // Resume Form Data State
      const [resumeData, setResumeData] = useState({
        name: "Rohan Kumar",
        title: "Software Engineer",
        email: "rohan.kumar@gmail.com",
        phone: "+91 98765 43210",
        location: "Delhi, India",
        about: "Software Engineer with 4+ years of experience in building scalable web applications.",
        skills: "JavaScript, React.js, Node.js, HTML/CSS",
        template: "modern" // 'modern', 'clean', 'executive'
      });

      // Payment Trigger Function
      const handlePaymentAndDownload = (planPrice) => {
        if (planPrice === 0) {
          downloadPDF();
          return;
        }

        const options = {
          key: "YOUR_RAZORPAY_KEY_ID", // Yahan apni Razorpay Key dalein
          amount: planPrice * 100, // Amount in paise
          currency: "INR",
          name: "MakeMyResume",
          description: "Resume PDF Download Fee",
          handler: function (response) {
            alert("Payment Successful! Payment ID: " + response.razorpay_payment_id);
            setStats(prev => ({
              ...prev,
              totalDownloads: prev.totalDownloads + 1,
              totalRevenue: prev.totalRevenue + planPrice
            }));
            downloadPDF();
          },
          prefill: {
            email: resumeData.email,
            contact: resumeData.phone
          },
          theme: { color: "#DC2626" }
        };

        // Razorpay popup check
        if (window.Razorpay) {
          const rzp = new window.Razorpay(options);
          rzp.open();
        } else {
          alert("Razorpay SDK fail ho gaya. Demo download shuru kar rahe hain.");
          downloadPDF();
        }
      };

      // HTML to PDF Download Function
      const downloadPDF = () => {
        const element = document.getElementById('resume-preview');
        const opt = {
          margin:       0.5,
          filename:     `${resumeData.name}_Resume.pdf`,
          image:        { type: 'jpeg', quality: 0.98 },
          html2canvas:  { scale: 2 },
          jsPDF:        { unit: 'in', format: 'letter', orientation: 'portrait' }
        };
        html2pdf().set(opt).from(element).save();
      };

      // User Delete from Admin Panel
      const handleDeleteUser = (id) => {
        setUsers(users.filter(u => u.id !== id));
      };

      return (
        <div>
          {/* Header / Navbar */}
          <nav className="flex justify-between items-center px-6 md:px-10 py-4 bg-white shadow-sm border-b sticky top-0 z-50">
            <div className="flex items-center gap-2 cursor-pointer" onClick={() => setCurrentPage('home')}>
              <div className="bg-red-600 text-white font-bold p-2 rounded-lg text-sm">MR</div>
              <span className="text-xl font-bold tracking-tight text-slate-900">MakeMyResume</span>
            </div>

            <div className="hidden md:flex gap-6 font-medium text-slate-600 text-sm">
              <button onClick={() => setCurrentPage('home')} className={currentPage === 'home' ? "text-red-600 font-semibold" : ""}>Home</button>
              <button onClick={() => setCurrentPage('editor')}>Builder & Templates</button>
              <button onClick={() => setCurrentPage('admin')} className={currentPage === 'admin' ? "text-red-600 font-semibold" : ""}>Admin Panel</button>
            </div>

            <div className="flex gap-3">
              <button onClick={() => setCurrentPage('editor')} className="bg-red-600 text-white text-sm font-semibold px-4 py-2 rounded-lg hover:bg-red-700 shadow-sm">
                Create Resume
              </button>
            </div>
          </nav>

          {/* PAGE 1: LANDING PAGE */}
          {currentPage === 'home' && (
            <div>
              {/* Hero Section */}
              <section className="text-center py-16 px-4 max-w-4xl mx-auto">
                <span className="bg-blue-50 text-blue-600 text-xs font-semibold px-3 py-1 rounded-full border border-blue-200">
                  ✨ AI POWERED RESUME BUILDER
                </span>
                <h1 className="text-4xl md:text-5xl font-extrabold mt-4 text-slate-900 leading-tight">
                  Create Your <br />
                  <span className="text-slate-900">Professional Resume </span>
                  That Gets <span className="text-red-600">You Hired</span>
                </h1>
                <p className="text-slate-500 max-w-xl mx-auto mt-4 text-sm">
                  Choose from 50+ ATS-friendly templates, customize in minutes, and download your resume in PDF.
                </p>
                <div className="mt-6 flex justify-center gap-4">
                  <button onClick={() => setCurrentPage('editor')} className="bg-red-600 text-white px-6 py-3 rounded-xl font-semibold shadow-lg hover:bg-red-700 flex items-center gap-2">
                    Create My Resume &rarr;
                  </button>
                </div>
              </section>

              {/* Pricing Section */}
              <section className="py-12 bg-white border-t">
                <h2 className="text-center text-2xl font-bold mb-1">Simple Pricing</h2>
                <p className="text-center text-sm text-slate-500 mb-8">Choose the plan that's right for you</p>

                <div className="max-w-4xl mx-auto grid grid-cols-1 md:grid-cols-3 gap-6 px-4">
                  {/* Free Plan */}
                  <div className="border rounded-2xl p-6 text-center hover:shadow-md transition bg-slate-50">
                    <h3 className="font-bold text-lg">Free</h3>
                    <div className="text-3xl font-extrabold my-3">₹{pricing.free}</div>
                    <p className="text-xs text-slate-400 mb-4">For basic users</p>
                    <button onClick={() => setCurrentPage('editor')} className="w-full border border-slate-300 py-2 rounded-lg font-semibold hover:bg-white">Get Started</button>
                  </div>

                  {/* Premium Plan */}
                  <div className="border-2 border-red-600 rounded-2xl p-6 text-center shadow-lg relative bg-white">
                    <span className="bg-red-600 text-white text-[10px] uppercase tracking-wider font-bold px-3 py-1 rounded-full absolute -top-3 left-1/2 -translate-x-1/2">
                      POPULAR
                    </span>
                    <h3 className="font-bold text-lg">Premium</h3>
                    <div className="text-3xl font-extrabold my-3 text-red-600">₹{pricing.premium}</div>
                    <p className="text-xs text-slate-400 mb-4">One-time payment</p>
                    <button onClick={() => handlePaymentAndDownload(pricing.premium)} className="w-full bg-red-600 text-white py-2 rounded-lg font-semibold hover:bg-red-700">Pay & Download</button>
                  </div>

                  {/* Pro Plan */}
                  <div className="border rounded-2xl p-6 text-center hover:shadow-md transition bg-slate-50">
                    <h3 className="font-bold text-lg">Pro</h3>
                    <div className="text-3xl font-extrabold my-3">₹{pricing.pro}</div>
                    <p className="text-xs text-slate-400 mb-4">For advanced users</p>
                    <button onClick={() => handlePaymentAndDownload(pricing.pro)} className="w-full border border-slate-300 py-2 rounded-lg font-semibold hover:bg-white">Pay & Download</button>
                  </div>
                </div>
              </section>
            </div>
          )}

          {/* PAGE 2: EDITOR PANEL & LIVE PREVIEW */}
          {currentPage === 'editor' && (
            <div className="max-w-7xl mx-auto p-6 grid grid-cols-1 lg:grid-cols-2 gap-8">
              {/* Form Controls */}
              <div className="bg-white p-6 rounded-2xl shadow-sm border">
                <h2 className="text-xl font-bold mb-4 text-slate-800">Edit Resume Details</h2>
                
                {/* Template Selector */}
                <div className="mb-4">
                  <label className="text-xs font-bold text-slate-600 block mb-1">Select Template Format</label>
                  <select 
                    value={resumeData.template} 
                    onChange={(e) => setResumeData({...resumeData, template: e.target.value})}
                    className="w-full border p-2 rounded-lg text-sm bg-slate-50"
                  >
                    <option value="modern">Modern Blue</option>
                    <option value="clean">Clean Minimal</option>
                    <option value="executive">Executive Dark</option>
                  </select>
                </div>

                <div className="space-y-3">
                  <div>
                    <label className="text-xs font-semibold block mb-1">Full Name</label>
                    <input type="text" value={resumeData.name} onChange={(e) => setResumeData({...resumeData, name: e.target.value})} className="w-full border p-2 rounded text-sm"/>
                  </div>
                  <div>
                    <label className="text-xs font-semibold block mb-1">Job Title</label>
                    <input type="text" value={resumeData.title} onChange={(e) => setResumeData({...resumeData, title: e.target.value})} className="w-full border p-2 rounded text-sm"/>
                  </div>
                  <div className="grid grid-cols-2 gap-2">
                    <div>
                      <label className="text-xs font-semibold block mb-1">Email</label>
                      <input type="text" value={resumeData.email} onChange={(e) => setResumeData({...resumeData, email: e.target.value})} className="w-full border p-2 rounded text-sm"/>
                    </div>
                    <div>
                      <label className="text-xs font-semibold block mb-1">Phone</label>
                      <input type="text" value={resumeData.phone} onChange={(e) => setResumeData({...resumeData, phone: e.target.value})} className="w-full border p-2 rounded text-sm"/>
                    </div>
                  </div>
                  <div>
                    <label className="text-xs font-semibold block mb-1">About Me</label>
                    <textarea value={resumeData.about} onChange={(e) => setResumeData({...resumeData, about: e.target.value})} className="w-full border p-2 rounded text-sm h-20"/>
                  </div>
                  <div>
                    <label className="text-xs font-semibold block mb-1">Skills (Comma separated)</label>
                    <input type="text" value={resumeData.skills} onChange={(e) => setResumeData({...resumeData, skills: e.target.value})} className="w-full border p-2 rounded text-sm"/>
                  </div>
                </div>

                <div className="mt-6">
                  <button onClick={() => handlePaymentAndDownload(pricing.premium)} className="w-full bg-red-600 text-white font-bold py-3 rounded-xl hover:bg-red-700 shadow-md">
                    Pay ₹{pricing.premium} & Download PDF
                  </button>
                </div>
              </div>

              {/* Live Preview Area */}
              <div>
                <h2 className="text-xl font-bold mb-4 text-slate-800">Live Preview</h2>
                <div id="resume-preview" className={`p-8 bg-white rounded-xl shadow-lg border min-h-[500px] ${
                  resumeData.template === 'modern' ? 'border-t-8 border-t-blue-600' :
                  resumeData.template === 'executive' ? 'border-t-8 border-t-slate-900' : 'border-t-8 border-t-emerald-600'
                }`}>
                  <h1 className="text-2xl font-bold text-slate-900">{resumeData.name || "Your Name"}</h1>
                  <p className="text-red-600 font-semibold text-sm mb-2">{resumeData.title || "Your Title"}</p>
                  
                  <div className="text-xs text-slate-500 mb-4 flex gap-3 border-b pb-2">
                    <span>{resumeData.email}</span>
                    <span>•</span>
                    <span>{resumeData.phone}</span>
                  </div>

                  <div className="mb-4">
                    <h3 className="text-sm font-bold border-b pb-1 mb-1 text-slate-700">ABOUT ME</h3>
                    <p className="text-xs text-slate-600">{resumeData.about}</p>
                  </div>

                  <div>
                    <h3 className="text-sm font-bold border-b pb-1 mb-1 text-slate-700">SKILLS</h3>
                    <div className="flex flex-wrap gap-1 mt-1">
                      {resumeData.skills.split(',').map((skill, index) => (
                        <span key={index} className="bg-slate-100 text-slate-700 text-[10px] px-2 py-1 rounded">
                          {skill.trim()}
                        </span>
                      ))}
                    </div>
                  </div>
                </div>
              </div>
            </div>
          )}

          {/* PAGE 3: ADMIN PANEL */}
          {currentPage === 'admin' && (
            <div className="max-w-6xl mx-auto p-6">
              <h1 className="text-2xl font-bold mb-6 text-slate-900">Admin Control Panel</h1>

              {/* Stats */}
              <div className="grid grid-cols-1 md:grid-cols-3 gap-6 mb-8">
                <div className="bg-white p-5 rounded-xl border shadow-sm">
                  <p className="text-xs text-slate-500 font-bold">TOTAL USERS</p>
                  <p className="text-2xl font-extrabold mt-1">{users.length}</p>
                </div>
                <div className="bg-white p-5 rounded-xl border shadow-sm">
                  <p className="text-xs text-slate-500 font-bold">TOTAL DOWNLOADS</p>
                  <p className="text-2xl font-extrabold mt-1">{stats.totalDownloads}</p>
                </div>
                <div className="bg-white p-5 rounded-xl border shadow-sm">
                  <p className="text-xs text-slate-500 font-bold">REVENUE COLLECTED</p>
                  <p className="text-2xl font-extrabold text-green-600 mt-1">₹{stats.totalRevenue}</p>
                </div>
              </div>

              {/* Pricing Customization */}
              <div className="bg-white p-6 rounded-xl border shadow-sm mb-8">
                <h3 className="font-bold mb-4 text-slate-800">Custom Download Pricing Settings</h3>
                <div className="flex gap-4 items-end">
                  <div>
                    <label className="text-xs font-semibold block mb-1">Premium Plan Price (₹)</label>
                    <input 
                      type="number" 
                      value={pricing.premium} 
                      onChange={(e) => setPricing({...pricing, premium: Number(e.target.value)})}
                      className="border p-2 rounded text-sm w-32"
                    />
                  </div>
                  <div>
                    <label className="text-xs font-semibold block mb-1">Pro Plan Price (₹)</label>
                    <input 
                      type="number" 
                      value={pricing.pro} 
                      onChange={(e) => setPricing({...pricing, pro: Number(e.target.value)})}
                      className="border p-2 rounded text-sm w-32"
                    />
                  </div>
                </div>
              </div>

              {/* Registered Users Data Table */}
              <div className="bg-white p-6 rounded-xl border shadow-sm">
                <h3 className="font-bold mb-4 text-slate-800">User Management</h3>
                <div className="overflow-x-auto">
                  <table className="w-full text-left border-collapse text-sm">
                    <thead>
                      <tr className="border-b text-slate-400">
                        <th className="py-2">Name</th>
                        <th className="py-2">Email</th>
                        <th className="py-2">Phone</th>
                        <th className="py-2">Downloads</th>
                        <th className="py-2">Action</th>
                      </tr>
                    </thead>
                    <tbody>
                      {users.map(u => (
                        <tr key={u.id} className="border-b">
                          <td className="py-3 font-semibold">{u.name}</td>
                          <td className="py-3">{u.email}</td>
                          <td className="py-3">{u.phone}</td>
                          <td className="py-3">{u.downloads}</td>
                          <td className="py-3">
                            <button onClick={() => handleDeleteUser(u.id)} className="text-red-600 hover:underline font-semibold text-xs">
                              Remove
                            </button>
                          </td>
                        </tr>
                      ))}
                    </tbody>
                  </table>
                </div>
              </div>
            </div>
          )}
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
