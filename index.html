<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Make My Resume</title>

    <!-- Tailwind CSS (Styling ke liye) -->
    <script src="https://cdn.tailwindcss.com"></script>

    <!-- React and ReactDOM CDN -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>

    <!-- Babel CDN (JSX ko compile karne ke liye) -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
</head>
<body class="bg-slate-100 p-6">

    <!-- React App Container -->
    <div id="root"></div>

    <!-- Script tag me type="text/babel" zaroori hai -->
    <script type="text/babel">
        const { useState } = React;

        function App() {
            // Initial States
            const [adminWidgets, setAdminWidgets] = useState([]);
            const [admins, setAdmins] = useState([
                { id: 1, email: 'admin@example.com', password: 'pass' }
            ]);
            const [users, setUsers] = useState([
                { id: 1, name: 'Rahul', email: 'rahul@test.com', phone: '9876543210', password: '123' }
            ]);
            const [show50TemplatesModal, setShow50TemplatesModal] = useState(false);
            const [currentPage, setCurrentPage] = useState('home');
            const [resumeForm, setResumeForm] = useState({ templateId: null });

            const templatesList = [
                { id: 1, title: 'Modern Resume', color: 'slate' },
                { id: 2, title: 'Professional Resume', color: 'blue' }
            ];

            return (
                <div class="max-w-4xl mx-auto bg-white p-6 rounded-lg shadow-md space-y-6">
                    {/* Create New Widgets Option */}
                    <div>
                        <h2 class="text-xl font-bold mb-2">Create New Custom Widget</h2>
                        <div class="space-y-2">
                            <input 
                                id="new-widget-name" 
                                type="text" 
                                placeholder="Widget Name" 
                                class="border p-2 rounded w-full" 
                            />
                            <textarea 
                                id="new-widget-code" 
                                placeholder="Widget Code/Content" 
                                class="border p-2 rounded w-full"
                            ></textarea>
                            <button 
                                onClick={() => {
                                    const name = document.getElementById('new-widget-name').value;
                                    const code = document.getElementById('new-widget-code').value;
                                    if (name) { 
                                        setAdminWidgets([...adminWidgets, { id: Date.now(), name, code }]); 
                                        alert('New Widget Created Successfully!'); 
                                    }
                                }} 
                                class="bg-slate-900 text-white font-bold text-xs px-4 py-2 rounded-lg"
                            >
                                Create Widget
                            </button>
                        </div>
                    </div>

                    <hr />

                    {/* Admin User Accounts Management */}
                    <div>
                        <h2 class="text-xl font-bold mb-2">Admin User Accounts Control</h2>
                        <button 
                            onClick={() => {
                                const email = prompt("Enter New Admin Email:");
                                const password = prompt("Enter New Admin Password:");
                                if (email && password) {
                                    setAdmins([...admins, { id: Date.now(), email, password }]);
                                }
                            }}
                            class="text-xs bg-blue-600 text-white font-bold px-3 py-1.5 rounded-lg mb-4"
                        >
                            + Add Admin Account
                        </button>

                        <table class="w-full text-left border-collapse">
                            <thead>
                                <tr class="border-b">
                                    <th class="py-2">Admin Email</th>
                                    <th class="py-2">Password</th>
                                    <th class="py-2">Action</th>
                                </tr>
                            </thead>
                            <tbody>
                                {admins.map(a => (
                                    <tr key={a.id} class="border-b">
                                        <td class="py-2">{a.email}</td>
                                        <td class="py-2">{a.password}</td>
                                        <td class="py-2">
                                            {admins.length > 1 && (
                                                <button 
                                                    onClick={() => setAdmins(admins.filter(item => item.id !== a.id))} 
                                                    class="text-red-600 font-bold hover:underline"
                                                >
                                                    Remove Admin
                                                </button>
                                            )}
                                        </td>
                                    </tr>
                                ))}
                            </tbody>
                        </table>
                    </div>

                    <hr />

                    {/* Registered User Data Table */}
                    <div>
                        <h2 class="text-xl font-bold mb-2">Registered User Database</h2>
                        <table class="w-full text-left border-collapse">
                            <thead>
                                <tr class="border-b">
                                    <th class="py-2">Name</th>
                                    <th class="py-2">Email</th>
                                    <th class="py-2">Phone Number</th>
                                    <th class="py-2">Password</th>
                                    <th class="py-2">Action</th>
                                </tr>
                            </thead>
                            <tbody>
                                {users.map(u => (
                                    <tr key={u.id} class="border-b">
                                        <td class="py-2">{u.name}</td>
                                        <td class="py-2">{u.email}</td>
                                        <td class="py-2">{u.phone}</td>
                                        <td class="py-2">{u.password}</td>
                                        <td class="py-2">
                                            <button 
                                                onClick={() => setUsers(users.filter(usr => usr.id !== u.id))} 
                                                class="text-red-600 font-bold hover:underline"
                                            >
                                                Delete User
                                            </button>
                                        </td>
                                    </tr>
                                ))}
                            </tbody>
                        </table>
                    </div>

                    <hr />

                    {/* Modal Toggle Button */}
                    <button 
                        onClick={() => setShow50TemplatesModal(true)} 
                        class="bg-green-600 text-white font-bold px-4 py-2 rounded-lg"
                    >
                        Open 50 Templates Catalog
                    </button>

                    {/* ALL 50 TEMPLATES CATALOG MODAL */}
                    {show50TemplatesModal && (
                        <div class="fixed inset-0 bg-black/50 flex items-center justify-center p-4">
                            <div class="bg-white p-6 rounded-xl max-w-2xl w-full">
                                <div class="flex justify-between items-center mb-4">
                                    <h3 class="text-lg font-bold">Select From All 50 Resume Formats</h3>
                                    <button 
                                        onClick={() => setShow50TemplatesModal(false)} 
                                        class="text-slate-400 font-bold hover:text-slate-800"
                                    >
                                        ✕ Close
                                    </button>
                                </div>
                                <div class="grid grid-cols-2 gap-4">
                                    {templatesList.map(tpl => (
                                        <div 
                                            key={tpl.id}
                                            onClick={() => {
                                                setResumeForm({ ...resumeForm, templateId: tpl.id });
                                                setShow50TemplatesModal(false);
                                                setCurrentPage('editor');
                                            }} 
                                            class={`border-2 rounded-xl p-3 text-center cursor-pointer hover:bg-slate-50 transition`}
                                        >
                                            <p class="font-semibold">{tpl.title}</p>
                                        </div>
                                    ))}
                                </div>
                            </div>
                        </div>
                    )}
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
