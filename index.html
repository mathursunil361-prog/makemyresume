<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title id="site-title-tag">MakeMyResume - Professional Resume Builder</title>

  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>

  <!-- React & React DOM -->
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  
  <!-- Babel -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <!-- Razorpay & HTML2PDF -->
  <script src="https://checkout.razorpay.com/v1/checkout.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
</head>
<body class="bg-slate-50 text-slate-800 font-sans">

  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect } = React;

    function App() {
      // System Config (Admin Adjustable)
      const [siteConfig, setSiteConfig] = useState({
        logoText: "MR",
        siteName: "MakeMyResume",
        razorpayKey: "",
        firebaseConfig: "",
        premiumPrice: 5
      });

      // Navigation & Auth States
      const [currentPage, setCurrentPage] = useState('home'); // 'home', 'editor', 'login', 'register', 'dashboard', 'admin'
      const [currentUser, setCurrentUser] = useState(null);
      const [showTemplatesModal, setShowTemplatesModal] = useState(false);

      // Admin Stats & Database
      const [stats, setStats] = useState({ totalVisits: 1240, totalDownloads: 88, totalRevenue: 440 });
      const [users, setUsers] = useState([
        { id: 1, name: "Rohan Kumar", email: "rohan@gmail.com", phone: "9876543210", password: "123", downloads: 2 }
      ]);

      // Form / Resume State
      const [resumeData, setResumeData] = useState({
        name: "Rohan Kumar",
        title: "Software Engineer",
        email: "rohan.kumar@gmail.com",
        phone: "+91 98765 43210",
        address: "Delhi, India",
        password: "",
        about: "Seeking a challenging position in a reputed organization where I can learn new skills, expand my knowledge, and leverage my learning’s. To get an opportunity where I can make the best of my potential and contribute to the organization's growth.",
        education: [{ course: "B.Tech CS", year: "2021", university: "DTU", percentage: "85%" }],
        experience: [{ company: "Tech Solutions", role: "Senior Engineer", years: "2 Years" }],
        template: "modern-blue",
        // Editor Custom Styling
        titleSize: 24,
        subTitleSize: 14,
        textSize: 12,
        textColor: "#1e293b",
        alignment: "left"
      });

      // 1. Template List (6 on slider, 50 in modal)
      const templatesList = Array.from({ length: 50 }, (_, i) => ({
        id: `tpl-${i + 1}`,
        name: i === 0 ? "Modern Blue" : i === 1 ? "Clean Green" : i === 2 ? "Executive Black" : i === 3 ? "Creative Purple" : i === 4 ? "Minimal Red" : i === 5 ? "Professional Yellow" : `Template Format ${i + 1}`,
        color: i % 6 === 0 ? "border-blue-600 text-blue-600" : i % 6 === 1 ? "border-green-600 text-green-600" : i % 6 === 2 ? "border-slate-800 text-slate-800" : i % 6 === 3 ? "border-purple-600 text-purple-600" : i % 6 === 4 ? "border-red-600 text-red-600" : "border-amber-500 text-amber-500"
      }));

      // Dynamic Registration / Auto-Save on Direct Creation
      const handleSaveAndRegister = (e) => {
        if (e) e.preventDefault();
        
        // Auto register if user doesn't exist
        let user = currentUser;
        if (!user) {
          if (!resumeData.email || !resumeData.password) {
            alert("Kripya registration/save ke liye Email aur Password bharein!");
            return;
          }
          user = { id: Date.now(), name: resumeData.name, email: resumeData.email, phone: resumeData.phone, password: resumeData.password, downloads: 0 };
          setUsers([...users, user]);
          setCurrentUser(user);
          alert("Aapka account create ho gaya hai aur resume profile me save ho gaya hai!");
        } else {
          alert("Resume successfully aapki profile me update ho gaya hai!");
        }
      };

      // Handle Paid Download
      const handleDownloadPayment = () => {
        // If no payment gateway key
        if (!siteConfig.razorpayKey) {
          alert("Payment Gateway Add Nahi Hai! Payment Gateway add karne ke baad hi download unlock hoga.");
          return;
        }

        const options = {
          key: siteConfig.razorpayKey,
          amount: siteConfig.premiumPrice * 100,
          currency: "INR",
          name: siteConfig.siteName,
          description: "Resume Download Fee",
          handler: function (response) {
            alert("Payment Successful! PDF Download shuru ho raha hai.");
            setStats(prev => ({ ...prev, totalDownloads: prev.totalDownloads + 1, totalRevenue: prev.totalRevenue + siteConfig.premiumPrice }));
            triggerPDFDownload(false); // Clean PDF Download
          },
          prefill: { email: resumeData.email, contact: resumeData.phone },
          theme: { color: "#DC2626" }
        };
        const rzp = new window.Razorpay(options);
        rzp.open();
      };

      // PDF Generator
      const triggerPDFDownload = (isWatermark) => {
        const element = document.getElementById('resume-preview-area');
        const opt = {
          margin: 0.2,
          filename: `${resumeData.name}_Resume.pdf`,
          image: { type: 'jpeg', quality: 0.98 },
          html2canvas: { scale: 2 },
          jsPDF: { unit: 'in', format: 'letter', orientation: 'portrait' }
        };
        html2pdf().set(opt).from(element).save();
      };

      // Add Dynamic Education / Experience Columns
      const addEducation = () => setResumeData({...resumeData, education: [...resumeData.education, { course: "", year: "", university: "", percentage: "" }]});
      const addExperience = () => setResumeData({...resumeData, experience: [...resumeData.experience, { company: "", role: "", years: "" }]});

      return (
        <div>
          {/* Top Navbar */}
          <nav className="flex justify-between items-center px-6 py-4 bg-white shadow-sm border-b sticky top-0 z-40">
            <div className="flex items-center gap-2 cursor-pointer" onClick={() => setCurrentPage('home')}>
              <div className="bg-red-600 text-white font-bold p-2 rounded-lg text-sm">{siteConfig.logoText}</div>
              <span className="text-xl font-bold tracking-tight text-slate-900">{siteConfig.siteName}</span>
            </div>

            <div className="hidden md:flex gap-6 font-medium text-slate-600 text-sm">
              <button onClick={() => setCurrentPage('home')} className={currentPage === 'home' ? "text-red-600 font-bold" : ""}>Home</button>
              <button onClick={() => setShowTemplatesModal(true)}>Templates</button>
              <button onClick={() => setCurrentPage('editor')} className={currentPage === 'editor' ? "text-red-600 font-bold" : ""}>Editor</button>
              {currentUser && <button onClick={() => setCurrentPage('dashboard')} className={currentPage === 'dashboard' ? "text-red-600 font-bold" : ""}>My Profile</button>}
            </div>

            <div className="flex items-center gap-3">
              {currentUser ? (
                <button onClick={() => setCurrentUser(null)} className="text-sm font-semibold text-slate-600">Logout</button>
              ) : (
                <>
                  <button onClick={() => setCurrentPage('login')} className="text-sm font-semibold text-slate-600">Log in</button>
                  <button onClick={() => setCurrentPage('register')} className="bg-red-600 text-white text-sm font-semibold px-4 py-2 rounded-lg hover:bg-red-700">Get Started</button>
                </>
              )}
              {/* Dedicated Admin Panel Access Button */}
              <button onClick={() => setCurrentPage('admin')} className="bg-slate-900 text-white text-xs px-3 py-2 rounded-lg font-bold">Admin</button>
            </div>
          </nav>

          {/* PAGE 1: HOME PAGE */}
          {currentPage === 'home' && (
            <div>
              <section className="text-center py-12 px-4 max-w-4xl mx-auto">
                <span className="bg-blue-50 text-blue-600 text-xs font-semibold px-3 py-1 rounded-full border border-blue-200">
                  ✨ AI POWERED RESUME BUILDER
                </span>
                <h1 className="text-4xl md:text-5xl font-extrabold mt-4 text-slate-900 leading-tight">
                  Create Your <br />
                  <span className="text-slate-900">Professional Resume </span>
                  That Gets <span className="text-red-600">You Hired</span>
                </h1>
                <p className="text-slate-500 max-w-xl mx-auto mt-3 text-sm">
                  Choose from 50+ ATS-friendly templates, customize in minutes, and download in PDF.
                </p>
                <div className="mt-6 flex justify-center gap-4">
                  <button onClick={() => setCurrentPage('editor')} className="bg-red-600 text-white px-6 py-3 rounded-xl font-semibold shadow-lg hover:bg-red-700">
                    Create My Resume &rarr;
                  </button>
                  <button onClick={() => setShowTemplatesModal(true)} className="bg-white border text-slate-700 px-6 py-3 rounded-xl font-semibold">
                    View Templates
                  </button>
                </div>
              </section>

              {/* Template Slider (Showing First 6 Templates) */}
              <section className="py-8 bg-white border-t px-6 max-w-6xl mx-auto">
                <div className="flex justify-between items-center mb-6">
                  <h2 className="text-xl font-bold">Professional Resume Templates</h2>
                  <button onClick={() => setShowTemplatesModal(true)} className="text-red-600 font-bold text-sm hover:underline">View All 50 Templates &rarr;</button>
                </div>
                <div className="grid grid-cols-2 md:grid-cols-6 gap-4">
                  {templatesList.slice(0, 6).map((tpl) => (
                    <div 
                      key={tpl.id} 
                      onClick={() => { setResumeData({...resumeData, template: tpl.id}); setCurrentPage('editor'); }} 
                      className={`border-2 ${tpl.color} rounded-xl p-4 text-center cursor-pointer hover:scale-105 transition bg-slate-50`}
                    >
                      <div className="h-28 border border-dashed rounded bg-white mb-2 flex items-center justify-center text-xs font-bold">📄 Visual Format</div>
                      <p className="text-xs font-bold text-slate-800">{tpl.name}</p>
                    </div>
                  ))}
                </div>
              </section>
            </div>
          )}

          {/* PAGE 2: RESUME EDITOR (MAIN PANEL) */}
          {currentPage === 'editor' && (
            <div className="max-w-7xl mx-auto p-4 md:p-6 grid grid-cols-1 lg:grid-cols-2 gap-6">
              {/* Form Input Controls */}
              <div className="bg-white p-6 rounded-2xl shadow-sm border max-h-[85vh] overflow-y-auto">
                <h2 className="text-lg font-bold mb-4 text-slate-800 border-b pb-2">1. Personal & Contact Info</h2>
                <div className="space-y-3">
                  <div>
                    <label className="text-xs font-semibold block">Full Name</label>
                    <input type="text" value={resumeData.name} onChange={(e) => setResumeData({...resumeData, name: e.target.value})} className="w-full border p-2 rounded text-sm"/>
                  </div>
                  <div>
                    <label className="text-xs font-semibold block">Job Title / Subtitle</label>
                    <input type="text" value={resumeData.title} onChange={(e) => setResumeData({...resumeData, title: e.target.value})} className="w-full border p-2 rounded text-sm"/>
                  </div>
                  <div className="grid grid-cols-2 gap-2">
                    <div>
                      <label className="text-xs font-semibold block">Email</label>
                      <input type="email" value={resumeData.email} onChange={(e) => setResumeData({...resumeData, email: e.target.value})} className="w-full border p-2 rounded text-sm"/>
                    </div>
                    <div>
                      <label className="text-xs font-semibold block">Phone</label>
                      <input type="text" value={resumeData.phone} onChange={(e) => setResumeData({...resumeData, phone: e.target.value})} className="w-full border p-2 rounded text-sm"/>
                    </div>
                  </div>
                  <div>
                    <label className="text-xs font-semibold block">Address</label>
                    <input type="text" value={resumeData.address} onChange={(e) => setResumeData({...resumeData, address: e.target.value})} className="w-full border p-2 rounded text-sm"/>
                  </div>
                  {!currentUser && (
                    <div>
                      <label className="text-xs font-semibold block text-red-600">Set Account Password (For Auto Save)</label>
                      <input type="password" placeholder="Create Password" value={resumeData.password} onChange={(e) => setResumeData({...resumeData, password: e.target.value})} className="w-full border p-2 rounded text-sm"/>
                    </div>
                  )}
                </div>

                <h2 className="text-lg font-bold mt-6 mb-4 text-slate-800 border-b pb-2">2. Objective / About</h2>
                <textarea value={resumeData.about} onChange={(e) => setResumeData({...resumeData, about: e.target.value})} className="w-full border p-2 rounded text-sm h-24"/>

                {/* Dynamic Education Section */}
                <div className="flex justify-between items-center mt-6 mb-2 border-b pb-2">
                  <h2 className="text-lg font-bold text-slate-800">3. Education</h2>
                  <button onClick={addEducation} className="text-xs bg-slate-900 text-white px-2 py-1 rounded">+ Add Row</button>
                </div>
                {resumeData.education.map((edu, idx) => (
                  <div key={idx} className="grid grid-cols-2 md:grid-cols-4 gap-2 mb-2 bg-slate-50 p-2 rounded">
                    <input placeholder="Course" value={edu.course} onChange={(e) => { const newEdu = [...resumeData.education]; newEdu[idx].course = e.target.value; setResumeData({...resumeData, education: newEdu}); }} className="border p-1 text-xs rounded"/>
                    <input placeholder="Passing Year" value={edu.year} onChange={(e) => { const newEdu = [...resumeData.education]; newEdu[idx].year = e.target.value; setResumeData({...resumeData, education: newEdu}); }} className="border p-1 text-xs rounded"/>
                    <input placeholder="University" value={edu.university} onChange={(e) => { const newEdu = [...resumeData.education]; newEdu[idx].university = e.target.value; setResumeData({...resumeData, education: newEdu}); }} className="border p-1 text-xs rounded"/>
                    <input placeholder="Percentage" value={edu.percentage} onChange={(e) => { const newEdu = [...resumeData.education]; newEdu[idx].percentage = e.target.value; setResumeData({...resumeData, education: newEdu}); }} className="border p-1 text-xs rounded"/>
                  </div>
                ))}

                {/* Dynamic Experience Section */}
                <div className="flex justify-between items-center mt-6 mb-2 border-b pb-2">
                  <h2 className="text-lg font-bold text-slate-800">4. Experience</h2>
                  <button onClick={addExperience} className="text-xs bg-slate-900 text-white px-2 py-1 rounded">+ Add Row</button>
                </div>
                {resumeData.experience.map((exp, idx) => (
                  <div key={idx} className="grid grid-cols-3 gap-2 mb-2 bg-slate-50 p-2 rounded">
                    <input placeholder="Company Name" value={exp.company} onChange={(e) => { const newExp = [...resumeData.experience]; newExp[idx].company = e.target.value; setResumeData({...resumeData, experience: newExp}); }} className="border p-1 text-xs rounded"/>
                    <input placeholder="Job Role" value={exp.role} onChange={(e) => { const newExp = [...resumeData.experience]; newExp[idx].role = e.target.value; setResumeData({...resumeData, experience: newExp}); }} className="border p-1 text-xs rounded"/>
                    <input placeholder="Years of Experience" value={exp.years} onChange={(e) => { const newExp = [...resumeData.experience]; newExp[idx].years = e.target.value; setResumeData({...resumeData, experience: newExp}); }} className="border p-1 text-xs rounded"/>
                  </div>
                ))}

                {/* Custom Styling Controls */}
                <h2 className="text-lg font-bold mt-6 mb-3 text-slate-800 border-b pb-2">5. Style & Custom Editor Tools</h2>
                <div className="grid grid-cols-2 md:grid-cols-4 gap-2 text-xs">
                  <div>
                    <label className="block font-semibold">Title Size</label>
                    <input type="number" value={resumeData.titleSize} onChange={(e) => setResumeData({...resumeData, titleSize: Number(e.target.value)})} className="border p-1 w-full rounded"/>
                  </div>
                  <div>
                    <label className="block font-semibold">Text Size</label>
                    <input type="number" value={resumeData.textSize} onChange={(e) => setResumeData({...resumeData, textSize: Number(e.target.value)})} className="border p-1 w-full rounded"/>
                  </div>
                  <div>
                    <label className="block font-semibold">Color</label>
                    <input type="color" value={resumeData.textColor} onChange={(e) => setResumeData({...resumeData, textColor: e.target.value})} className="border p-1 w-full rounded h-8"/>
                  </div>
                  <div>
                    <label className="block font-semibold">Align</label>
                    <select value={resumeData.alignment} onChange={(e) => setResumeData({...resumeData, alignment: e.target.value})} className="border p-1 w-full rounded">
                      <option value="left">Left</option>
                      <option value="center">Center</option>
                      <option value="right">Right</option>
                    </select>
                  </div>
                </div>

                <div className="mt-6 space-y-2">
                  <button onClick={handleSaveAndRegister} className="w-full bg-slate-900 text-white font-bold py-2.5 rounded-xl text-sm">
                    💾 Save Resume to Profile
                  </button>
                  <button onClick={handleDownloadPayment} className="w-full bg-red-600 text-white font-bold py-3 rounded-xl hover:bg-red-700 shadow-md">
                    Pay ₹{siteConfig.premiumPrice} & Download Without Watermark
                  </button>
                </div>
              </div>

              {/* LIVE PREVIEW AREA WITH WATERMARK */}
              <div className="relative">
                <div className="flex justify-between items-center mb-2">
                  <h2 className="text-lg font-bold text-slate-800">Live Preview (Watermarked Free View)</h2>
                  <span className="text-xs bg-amber-100 text-amber-800 font-bold px-2.5 py-1 rounded-full">Preview Mode</span>
                </div>

                <div id="resume-preview-area" className="relative p-8 bg-white rounded-xl shadow-lg border min-h-[600px] overflow-hidden" style={{ textAlign: resumeData.alignment }}>
                  {/* Watermark Overlay */}
                  <div className="absolute inset-0 pointer-events-none flex items-center justify-center opacity-10 rotate-45 select-none">
                    <h1 className="text-6xl font-extrabold text-slate-900 uppercase tracking-widest">WATERMARK PREVIEW</h1>
                  </div>

                  <h1 style={{ fontSize: `${resumeData.titleSize}px`, color: resumeData.textColor }} className="font-bold">{resumeData.name || "Your Name"}</h1>
                  <p style={{ fontSize: `${resumeData.subTitleSize}px` }} className="text-red-600 font-semibold mb-2">{resumeData.title || "Your Title"}</p>
                  
                  <div style={{ fontSize: `${resumeData.textSize}px` }} className="text-slate-500 mb-4 border-b pb-2">
                    <span>{resumeData.email}</span> | <span>{resumeData.phone}</span> | <span>{resumeData.address}</span>
                  </div>

                  <div className="mb-4">
                    <h3 className="font-bold border-b pb-1 mb-1 text-slate-700" style={{ fontSize: `${resumeData.textSize + 2}px` }}>CAREER OBJECTIVE</h3>
                    <p style={{ fontSize: `${resumeData.textSize}px` }} className="text-slate-600">{resumeData.about}</p>
                  </div>

                  <div className="mb-4">
                    <h3 className="font-bold border-b pb-1 mb-1 text-slate-700" style={{ fontSize: `${resumeData.textSize + 2}px` }}>EDUCATION</h3>
                    {resumeData.education.map((edu, i) => (
                      <div key={i} className="flex justify-between text-slate-700 py-0.5" style={{ fontSize: `${resumeData.textSize}px` }}>
                        <span className="font-semibold">{edu.course} - {edu.university}</span>
                        <span>{edu.percentage} ({edu.year})</span>
                      </div>
                    ))}
                  </div>

                  <div>
                    <h3 className="font-bold border-b pb-1 mb-1 text-slate-700" style={{ fontSize: `${resumeData.textSize + 2}px` }}>EXPERIENCE</h3>
                    {resumeData.experience.map((exp, i) => (
                      <div key={i} className="flex justify-between text-slate-700 py-0.5" style={{ fontSize: `${resumeData.textSize}px` }}>
                        <span className="font-semibold">{exp.role} at {exp.company}</span>
                        <span>{exp.years}</span>
                      </div>
                    ))}
                  </div>
                </div>
              </div>
            </div>
          )}

          {/* PAGE 3: ADMIN PANEL */}
          {currentPage === 'admin' && (
            <div className="max-w-6xl mx-auto p-6">
              <h1 className="text-2xl font-bold mb-6 text-slate-900 border-b pb-2">Admin Control Center</h1>

              {/* Realtime Stats */}
              <div className="grid grid-cols-1 md:grid-cols-3 gap-6 mb-8">
                <div className="bg-white p-5 rounded-xl border shadow-sm">
                  <p className="text-xs text-slate-500 font-bold">LIVE SITE VISITS</p>
                  <p className="text-2xl font-extrabold mt-1">{stats.totalVisits}</p>
                </div>
                <div className="bg-white p-5 rounded-xl border shadow-sm">
                  <p className="text-xs text-slate-500 font-bold">RESUMES DOWNLOADED</p>
                  <p className="text-2xl font-extrabold mt-1 text-blue-600">{stats.totalDownloads}</p>
                </div>
                <div className="bg-white p-5 rounded-xl border shadow-sm">
                  <p className="text-xs text-slate-500 font-bold">TOTAL PAYMENTS COLLECTED</p>
                  <p className="text-2xl font-extrabold text-green-600 mt-1">₹{stats.totalRevenue}</p>
                </div>
              </div>

              {/* Admin Widgets Settings */}
              <div className="bg-white p-6 rounded-xl border shadow-sm mb-8 space-y-4">
                <h3 className="font-bold text-slate-800 border-b pb-2">Website Settings & Integration Widgets</h3>
                <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
                  <div>
                    <label className="text-xs font-semibold block mb-1">Razorpay Key ID Widget</label>
                    <input type="text" placeholder="rzp_live_xxx" value={siteConfig.razorpayKey} onChange={(e) => setSiteConfig({...siteConfig, razorpayKey: e.target.value})} className="border p-2 rounded text-sm w-full"/>
                  </div>
                  <div>
                    <label className="text-xs font-semibold block mb-1">Firebase Configuration Widget</label>
                    <input type="text" placeholder="Firebase Config API" value={siteConfig.firebaseConfig} onChange={(e) => setSiteConfig({...siteConfig, firebaseConfig: e.target.value})} className="border p-2 rounded text-sm w-full"/>
                  </div>
                  <div>
                    <label className="text-xs font-semibold block mb-1">Set Custom Resume Download Fee (₹)</label>
                    <input type="number" value={siteConfig.premiumPrice} onChange={(e) => setSiteConfig({...siteConfig, premiumPrice: Number(e.target.value)})} className="border p-2 rounded text-sm w-full"/>
                  </div>
                  <div>
                    <label className="text-xs font-semibold block mb-1">Website Title & Logo Name</label>
                    <div className="flex gap-2">
                      <input type="text" value={siteConfig.logoText} onChange={(e) => setSiteConfig({...siteConfig, logoText: e.target.value})} className="border p-2 rounded text-sm w-20"/>
                      <input type="text" value={siteConfig.siteName} onChange={(e) => setSiteConfig({...siteConfig, siteName: e.target.value})} className="border p-2 rounded text-sm w-full"/>
                    </div>
                  </div>
                </div>
              </div>

              {/* Registered Users Management */}
              <div className="bg-white p-6 rounded-xl border shadow-sm">
                <h3 className="font-bold mb-4 text-slate-800">User Management Data</h3>
                <table className="w-full text-left border-collapse text-sm">
                  <thead>
                    <tr className="border-b text-slate-400">
                      <th className="py-2">Name</th>
                      <th className="py-2">Email</th>
                      <th className="py-2">Phone</th>
                      <th className="py-2">Password</th>
                      <th className="py-2">Action</th>
                    </tr>
                  </thead>
                  <tbody>
                    {users.map(u => (
                      <tr key={u.id} className="border-b">
                        <td className="py-3 font-semibold">{u.name}</td>
                        <td className="py-3">{u.email}</td>
                        <td className="py-3">{u.phone}</td>
                        <td className="py-3">{u.password}</td>
                        <td className="py-3">
                          <button onClick={() => setUsers(users.filter(usr => usr.id !== u.id))} className="text-red-600 font-bold hover:underline">Remove User</button>
                        </td>
                      </tr>
                    ))}
                  </tbody>
                </table>
              </div>
            </div>
          )}

          {/* PAGE 4: USER DASHBOARD / PROFILE */}
          {currentPage === 'dashboard' && currentUser && (
            <div className="max-w-4xl mx-auto p-6">
              <h1 className="text-2xl font-bold mb-4">Welcome, {currentUser.name}</h1>
              <div className="bg-white p-6 rounded-xl border shadow-sm">
                <h3 className="font-bold mb-2">Saved Resumes</h3>
                <div className="flex justify-between items-center border p-4 rounded-xl">
                  <div>
                    <p className="font-bold">{resumeData.name}'s Resume</p>
                    <p className="text-xs text-slate-500">Last updated: Today</p>
                  </div>
                  <div className="flex gap-2">
                    <button onClick={() => setCurrentPage('editor')} className="bg-slate-900 text-white text-xs px-3 py-2 rounded">Edit Resume</button>
                  </div>
                </div>
              </div>
            </div>
          )}

          {/* PAGE 5: ALL 50 TEMPLATES MODAL */}
          {showTemplatesModal && (
            <div className="fixed inset-0 bg-black/50 z-50 flex items-center justify-center p-4">
              <div className="bg-white rounded-2xl p-6 max-w-4xl w-full max-h-[80vh] overflow-y-auto">
                <div className="flex justify-between items-center mb-4">
                  <h2 className="text-xl font-bold">Select From 50 ATS Templates</h2>
                  <button onClick={() => setShowTemplatesModal(false)} className="text-red-600 font-bold">✕ Close</button>
                </div>
                <div className="grid grid-cols-2 md:grid-cols-4 gap-4">
                  {templatesList.map((tpl) => (
                    <div 
                      key={tpl.id}
                      onClick={() => { setResumeData({...resumeData, template: tpl.id}); setShowTemplatesModal(false); setCurrentPage('editor'); }}
                      className={`border-2 ${tpl.color} rounded-xl p-3 text-center cursor-pointer hover:bg-slate-50`}
                    >
                      <div className="h-20 border border-dashed rounded bg-slate-50 mb-2 flex items-center justify-center text-xs">Visual Design</div>
                      <p className="text-xs font-bold">{tpl.name}</p>
                    </div>
                  ))}
                </div>
              </div>
            </div>
          )}
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
