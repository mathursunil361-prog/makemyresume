<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title id="dynamic-site-title">Make My Resume - Fast & Professional Resume Builder</title>

  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>

  <!-- React & React DOM via CDN -->
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  
  <!-- Babel Compiler for JSX -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <!-- External Libraries for Payments & PDF Export -->
  <script src="https://checkout.razorpay.com/v1/checkout.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
  
  <!-- FontAwesome Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
</head>
<body class="bg-slate-50 text-slate-800 font-sans antialiased selection:bg-blue-500 selection:text-white">

  <div id="root"></div>

  <!-- Dynamic Custom Code Container for Admin Extensions -->
  <div id="admin-custom-code-container"></div>

  <script type="text/babel">
    const { useState, useEffect } = React;

    function App() {
      // 1. SITE CONFIGURATION (Admin Customizable)
      const [siteConfig, setSiteConfig] = useState({
        logoText: "MMR",
        siteName: "Make My Resume",
        subtitle: "Fast & Professional Resume Builder",
        razorpayKey: "",
        customPrice: 49,
        customCode: ""
      });

      // Update Site Title dynamically
      useEffect(() => {
        document.title = `${siteConfig.siteName} - ${siteConfig.subtitle}`;
      }, [siteConfig.siteName, siteConfig.subtitle]);

      // 2. APP NAVIGATION & USER STATE
      const [currentPage, setCurrentPage] = useState('home'); // 'home', 'templates', 'editor', 'login', 'register', 'dashboard', 'admin'
      const [currentUser, setCurrentUser] = useState(null);
      const [show50TemplatesModal, setShow50TemplatesModal] = useState(false);
      const [activeSlide, setActiveSlide] = useState(0);

      // 3. ADMIN ANALYTICS & DATABASE
      const [analytics, setAnalytics] = useState({
        downloads: 142,
        totalPayouts: 6958,
        siteTraffic: 4890
      });

      const [users, setUsers] = useState([
        { 
          id: 1, 
          name: "Rahul Sharma", 
          email: "rahul@example.com", 
          phone: "9876543210", 
          password: "user123",
          downloads: 2
        },
        { 
          id: 2, 
          name: "Priya Singh", 
          email: "priya@example.com", 
          phone: "9123456789", 
          password: "password123",
          downloads: 1
        }
      ]);

      const [admins, setAdmins] = useState([
        { id: 1, email: "admin@makemyresume.com", password: "adminpassword" }
      ]);

      const [adminWidgets, setAdminWidgets] = useState([
        { id: 1, name: "SEO Optimization Widget", code: "<!-- SEO Tags Active -->" }
      ]);

      // 4. REGISTRATION FORM STATE (Seq: Qualification, Percentage, Passing Year, Institute)
      const [regForm, setRegForm] = useState({
        name: "",
        phone: "",
        email: "",
        password: "",
        education: [{ qualification: "", percentage: "", passingYear: "", institute: "" }],
        experience: [{ company: "", profile: "", years: "" }]
      });

      // 5. RESUME EDITOR FORM STATE
      const [resumeForm, setResumeForm] = useState({
        name: "Rahul Sharma",
        phone: "9876543210",
        motherName: "Sunita Sharma",
        fatherName: "Rajesh Sharma",
        email: "rahul@example.com",
        address: "A-123, Green Park",
        country: "India",
        district: "Bhopal",
        city: "Bhopal",
        village: "Kolar",
        education: [
          { qualification: "B.Tech Computer Science", percentage: "82%", passingYear: "2023", institute: "RGPV University" }
        ],
        experience: [
          { company: "Tech Mahindra", profile: "Software Engineer", years: "2 Years" }
        ],
        templateId: "tpl-1"
      });

      // 6. ADMIN LOGIN STATE & FORM
      const [adminLoginForm, setAdminLoginForm] = useState({ email: "", password: "" });
      const [isAdminLoggedIn, setIsAdminLoggedIn] = useState(false);

      // Inject custom admin code dynamically
      useEffect(() => {
        const container = document.getElementById('admin-custom-code-container');
        if (container) container.innerHTML = siteConfig.customCode;
      }, [siteConfig.customCode]);

      // Dynamic Row Handlers for Registration Form
      const addRegEduRow = () => setRegForm({...regForm, education: [...regForm.education, { qualification: "", percentage: "", passingYear: "", institute: "" }]});
      const removeRegEduRow = (idx) => setRegForm({...regForm, education: regForm.education.filter((_, i) => i !== idx)});
      const addRegExpRow = () => setRegForm({...regForm, experience: [...regForm.experience, { company: "", profile: "", years: "" }]});
      const removeRegExpRow = (idx) => setRegForm({...regForm, experience: regForm.experience.filter((_, i) => i !== idx)});

      // Dynamic Row Handlers for Editor Form
      const addResumeEduRow = () => setResumeForm({...resumeForm, education: [...resumeForm.education, { qualification: "", percentage: "", passingYear: "", institute: "" }]});
      const removeResumeEduRow = (idx) => setResumeForm({...resumeForm, education: resumeForm.education.filter((_, i) => i !== idx)});
      const addResumeExpRow = () => setResumeForm({...resumeForm, experience: [...resumeForm.experience, { company: "", profile: "", years: "" }]});
      const removeResumeExpRow = (idx) => setResumeForm({...resumeForm, experience: resumeForm.experience.filter((_, i) => i !== idx)});

      // User Registration Handler
      const handleUserRegister = (e) => {
        e.preventDefault();
        const newUser = {
          id: Date.now(),
          name: regForm.name,
          email: regForm.email,
          phone: regForm.phone,
          password: regForm.password,
          downloads: 0
        };
        setUsers([...users, newUser]);
        setCurrentUser(newUser);

        // Save details to profile & auto populate resume form
        setResumeForm({
          ...resumeForm,
          name: regForm.name,
          phone: regForm.phone,
          email: regForm.email,
          education: regForm.education.length > 0 && regForm.education[0].qualification ? regForm.education : resumeForm.education,
          experience: regForm.experience.length > 0 && regForm.experience[0].company ? regForm.experience : resumeForm.experience
        });

        alert("Registration Successful! Aapke details profile me save ho gaye hain.");
        setCurrentPage('dashboard');
      };

      // User Login Handler
      const handleUserLogin = (e) => {
        e.preventDefault();
        const found = users.find(u => (u.email === regForm.email || u.phone === regForm.email) && u.password === regForm.password);
        if (found) {
          setCurrentUser(found);
          alert("Login successful! Welcome " + found.name);
          setCurrentPage('dashboard');
        } else {
          alert("Sahi Email/Mobile Number ya Password daalein!");
        }
      };

      // Payment & Download Logic
      const handleDownloadClick = () => {
        if (!siteConfig.razorpayKey || siteConfig.razorpayKey.trim() === "") {
          alert("⚠️ Abhi koi bhi payment gateway integrated nahi hai. Kripya Admin Panel me Razorpay Key set karein!");
          return;
        }

        const options = {
          key: siteConfig.razorpayKey,
          amount: siteConfig.customPrice * 100, // Amount in paise
          currency: "INR",
          name: siteConfig.siteName,
          description: "Resume Download Payment",
          handler: function (response) {
            alert("Payment successful! Transaction ID: " + response.razorpay_payment_id);
            setAnalytics(prev => ({
              ...prev,
              downloads: prev.downloads + 1,
              totalPayouts: prev.totalPayouts + siteConfig.customPrice
            }));
            generateCleanPDF();
          },
          prefill: { email: resumeForm.email, contact: resumeForm.phone },
          theme: { color: "#2563EB" }
        };

        const rzp = new window.Razorpay(options);
        rzp.open();
      };

      // Generate Clean PDF Download Without Watermark
      const generateCleanPDF = () => {
        const element = document.getElementById('printable-resume');
        const watermark = document.getElementById('resume-watermark');
        if (watermark) watermark.style.display = 'none';

        const opt = {
          margin: 0.3,
          filename: `${resumeForm.name.replace(/\s+/g, '_')}_Resume.pdf`,
          image: { type: 'jpeg', quality: 0.98 },
          html2canvas: { scale: 2, useCORS: true },
          jsPDF: { unit: 'in', format: 'letter', orientation: 'portrait' }
        };

        html2pdf().set(opt).from(element).save().then(() => {
          if (watermark) watermark.style.display = 'flex';
        });
      };

      // 50 Templates Catalog Definition
      const templatesList = Array.from({ length: 50 }, (_, i) => ({
        id: `tpl-${i + 1}`,
        title: `Template Format ${i + 1}`,
        color: i % 4 === 0 ? "border-blue-600 bg-blue-50" : i % 4 === 1 ? "border-emerald-600 bg-emerald-50" : i % 4 === 2 ? "border-purple-600 bg-purple-50" : "border-slate-800 bg-slate-100"
      }));

      // Slide templates (6 item display slider)
      const slideTemplates = templatesList.slice(0, 6);

      return (
        <div className="min-h-screen flex flex-col">
          
          {/* HEADER NAVIGATION BAR */}
          <header className="bg-white border-b sticky top-0 z-40 shadow-sm">
            <div className="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-16 flex items-center justify-between">
              
              {/* Logo and Name with Subtitle */}
              <div className="flex items-center gap-3 cursor-pointer" onClick={() => setCurrentPage('home')}>
                <div className="bg-blue-600 text-white font-extrabold px-3 py-1.5 rounded-xl shadow-md text-xl tracking-wide">
                  {siteConfig.logoText}
                </div>
                <div>
                  <h1 className="font-extrabold text-lg leading-none text-slate-900">{siteConfig.siteName}</h1>
                  <span className="text-xs text-blue-600 font-medium block leading-tight">{siteConfig.subtitle}</span>
                </div>
              </div>

              {/* Navigation Links */}
              <nav className="hidden md:flex items-center gap-6 text-sm font-semibold text-slate-600">
                <button onClick={() => setCurrentPage('home')} className={currentPage === 'home' ? 'text-blue-600 font-bold border-b-2 border-blue-600 pb-1' : 'hover:text-blue-600 transition'}>Home</button>
                <button onClick={() => setShow50TemplatesModal(true)} className="hover:text-blue-600 transition">Templates</button>
                <button onClick={() => setCurrentPage('home')} className="hover:text-blue-600 transition">Pricing</button>
                <button onClick={() => setCurrentPage('editor')} className={currentPage === 'editor' ? 'text-blue-600 font-bold border-b-2 border-blue-600 pb-1' : 'hover:text-blue-600 transition'}>Editor</button>
                <button onClick={() => setCurrentPage('admin')} className={currentPage === 'admin' ? 'text-blue-600 font-bold border-b-2 border-blue-600 pb-1' : 'hover:text-blue-600 transition'}>Admin Login</button>
              </nav>

              {/* User Authentication Options */}
              <div className="flex items-center gap-3">
                {currentUser ? (
                  <div className="flex items-center gap-3">
                    <button onClick={() => setCurrentPage('dashboard')} className="text-xs font-bold text-blue-700 bg-blue-50 border border-blue-200 px-3 py-1.5 rounded-lg flex items-center gap-1">
                      <i className="fa-solid fa-user"></i> {currentUser.name}
                    </button>
                    <button onClick={() => setCurrentUser(null)} className="text-xs font-semibold text-slate-500 hover:text-red-600">
                      Logout
                    </button>
                  </div>
                ) : (
                  <>
                    <button onClick={() => setCurrentPage('login')} className="text-sm font-semibold text-slate-600 hover:text-blue-600 px-3 py-1.5">Log In</button>
                    <button onClick={() => setCurrentPage('register')} className="bg-blue-600 text-white text-sm font-bold px-4 py-2 rounded-xl hover:bg-blue-700 shadow-md transition">Register</button>
                  </>
                )}
              </div>
            </div>
          </header>

          {/* MAIN CONTENT AREA */}
          <main className="flex-1">

            {/* 1. MAIN LANDING PAGE */}
            {currentPage === 'home' && (
              <div>
                {/* Hero Section */}
                <section className="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-12 md:py-16 grid grid-cols-1 lg:grid-cols-12 gap-10 items-center">
                  
                  {/* Left Side: Headline & "Create Resume" & "Templates" Buttons */}
                  <div className="lg:col-span-6 space-y-6">
                    <span className="bg-blue-50 text-blue-700 border border-blue-200 text-xs font-bold px-3 py-1 rounded-full inline-flex items-center gap-1.5">
                      <i className="fa-solid fa-sparkles"></i> ATS-Friendly Resume Builder
                    </span>
                    <h1 className="text-4xl sm:text-5xl font-extrabold text-slate-900 leading-tight">
                      Aapka <span className="text-blue-600">{siteConfig.siteName}</span> Builder <br /> Fast, Easy & Professional
                    </h1>
                    <p className="text-slate-600 text-base leading-relaxed">
                      Sahi format me apna resume banayein aur high paying job paayein. Professional templates choose karein aur watermark-free PDF download karein.
                    </p>
                    
                    {/* Action Buttons on Left Side */}
                    <div className="flex flex-wrap gap-4 pt-2">
                      <button onClick={() => setCurrentPage('editor')} className="bg-blue-600 text-white font-bold px-7 py-3.5 rounded-xl shadow-lg hover:bg-blue-700 transition flex items-center gap-2">
                        <i className="fa-solid fa-file-pen"></i> Create Resume
                      </button>
                      <button onClick={() => setShow50TemplatesModal(true)} className="bg-white border-2 border-slate-300 text-slate-700 font-bold px-7 py-3.5 rounded-xl hover:border-blue-600 hover:text-blue-600 transition flex items-center gap-2">
                        <i className="fa-solid fa-layer-group"></i> Templates
                      </button>
                    </div>
                  </div>

                  {/* Right Side: 3 to 4 Resume Cards Display (As reference image) */}
                  <div className="lg:col-span-6 grid grid-cols-2 gap-4">
                    
                    {/* Card 1 */}
                    <div className="bg-white p-4 rounded-2xl border border-slate-200 shadow-lg hover:shadow-xl transition border-t-4 border-t-blue-600 space-y-3">
                      <div className="flex justify-between items-center">
                        <div className="h-3 bg-blue-600 w-20 rounded"></div>
                        <span className="text-[10px] bg-blue-50 text-blue-600 font-bold px-2 py-0.5 rounded">Modern</span>
                      </div>
                      <div className="space-y-1.5">
                        <div className="h-2 bg-slate-200 w-full rounded"></div>
                        <div className="h-2 bg-slate-100 w-3/4 rounded"></div>
                      </div>
                      <div className="h-20 bg-slate-50 border border-dashed border-slate-200 rounded-lg p-2 space-y-1">
                        <div className="h-1.5 bg-slate-300 w-1/2 rounded"></div>
                        <div className="h-1 bg-slate-200 w-full rounded"></div>
                        <div className="h-1 bg-slate-200 w-5/6 rounded"></div>
                      </div>
                      <p className="text-xs font-bold text-slate-800 text-center">Modern Blue Format</p>
                    </div>

                    {/* Card 2 */}
                    <div className="bg-white p-4 rounded-2xl border border-slate-200 shadow-lg hover:shadow-xl transition border-t-4 border-t-emerald-600 space-y-3 mt-4">
                      <div className="flex justify-between items-center">
                        <div className="h-3 bg-emerald-600 w-20 rounded"></div>
                        <span className="text-[10px] bg-emerald-50 text-emerald-600 font-bold px-2 py-0.5 rounded">Executive</span>
                      </div>
                      <div className="space-y-1.5">
                        <div className="h-2 bg-slate-200 w-full rounded"></div>
                        <div className="h-2 bg-slate-100 w-3/4 rounded"></div>
                      </div>
                      <div className="h-20 bg-slate-50 border border-dashed border-slate-200 rounded-lg p-2 space-y-1">
                        <div className="h-1.5 bg-slate-300 w-1/2 rounded"></div>
                        <div className="h-1 bg-slate-200 w-full rounded"></div>
                        <div className="h-1 bg-slate-200 w-5/6 rounded"></div>
                      </div>
                      <p className="text-xs font-bold text-slate-800 text-center">Clean Executive</p>
                    </div>

                    {/* Card 3 */}
                    <div className="bg-white p-4 rounded-2xl border border-slate-200 shadow-lg hover:shadow-xl transition border-t-4 border-t-purple-600 space-y-3">
                      <div className="flex justify-between items-center">
                        <div className="h-3 bg-purple-600 w-20 rounded"></div>
                        <span className="text-[10px] bg-purple-50 text-purple-600 font-bold px-2 py-0.5 rounded">Creative</span>
                      </div>
                      <div className="space-y-1.5">
                        <div className="h-2 bg-slate-200 w-full rounded"></div>
                        <div className="h-2 bg-slate-100 w-3/4 rounded"></div>
                      </div>
                      <div className="h-20 bg-slate-50 border border-dashed border-slate-200 rounded-lg p-2 space-y-1">
                        <div className="h-1.5 bg-slate-300 w-1/2 rounded"></div>
                        <div className="h-1 bg-slate-200 w-full rounded"></div>
                        <div className="h-1 bg-slate-200 w-5/6 rounded"></div>
                      </div>
                      <p className="text-xs font-bold text-slate-800 text-center">Creative Design</p>
                    </div>

                    {/* Card 4 */}
                    <div className="bg-white p-4 rounded-2xl border border-slate-200 shadow-lg hover:shadow-xl transition border-t-4 border-t-slate-800 space-y-3 mt-4">
                      <div className="flex justify-between items-center">
                        <div className="h-3 bg-slate-800 w-20 rounded"></div>
                        <span className="text-[10px] bg-slate-100 text-slate-800 font-bold px-2 py-0.5 rounded">Classic</span>
                      </div>
                      <div className="space-y-1.5">
                        <div className="h-2 bg-slate-200 w-full rounded"></div>
                        <div className="h-2 bg-slate-100 w-3/4 rounded"></div>
                      </div>
                      <div className="h-20 bg-slate-50 border border-dashed border-slate-200 rounded-lg p-2 space-y-1">
                        <div className="h-1.5 bg-slate-300 w-1/2 rounded"></div>
                        <div className="h-1 bg-slate-200 w-full rounded"></div>
                        <div className="h-1 bg-slate-200 w-5/6 rounded"></div>
                      </div>
                      <p className="text-xs font-bold text-slate-800 text-center">Classic Minimal</p>
                    </div>

                  </div>
                </section>

                {/* SLIDER DISPLAYING 6 TEMPLATES & VIEW ALL TEMPLATES BUTTON DIRECTLY BELOW IT */}
                <section className="bg-white border-t border-slate-200 py-12">
                  <div className="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 space-y-8">
                    <div className="text-center space-y-2">
                      <h2 className="text-3xl font-extrabold text-slate-900">Featured Resume Slider</h2>
                      <p className="text-slate-500 text-sm">Select any layout to start editing immediately</p>
                    </div>

                    {/* 6 Templates Slider Display Grid */}
                    <div className="grid grid-cols-2 md:grid-cols-6 gap-4">
                      {slideTemplates.map((tpl, idx) => (
                        <div 
                          key={tpl.id}
                          onClick={() => { setResumeForm({...resumeForm, templateId: tpl.id}); setCurrentPage('editor'); }}
                          className={`border-2 ${tpl.color} rounded-2xl p-3 text-center cursor-pointer hover:shadow-xl transition transform hover:-translate-y-1 group relative`}
                        >
                          <div className="h-32 border border-dashed border-slate-300 bg-white rounded-xl mb-3 flex flex-col items-center justify-center p-2 space-y-1 group-hover:border-blue-500">
                            <i className="fa-regular fa-file-lines text-2xl text-slate-400 group-hover:text-blue-600"></i>
                            <span className="text-[11px] font-bold text-slate-500">Format {idx + 1}</span>
                          </div>
                          <p className="text-xs font-bold text-slate-800">{tpl.title}</p>
                        </div>
                      ))}
                    </div>

                    {/* "View All Templates" Option Directly Below Slider */}
                    <div className="text-center pt-2">
                      <button 
                        onClick={() => setShow50TemplatesModal(true)} 
                        className="bg-slate-900 text-white font-bold text-sm px-8 py-3.5 rounded-xl hover:bg-slate-800 shadow-md transition inline-flex items-center gap-2"
                      >
                        <i className="fa-solid fa-table-cells"></i> View All Templates
                      </button>
                    </div>
                  </div>
                </section>
              </div>
            )}

            {/* 2. USER REGISTRATION PAGE */}
            {currentPage === 'register' && (
              <div className="max-w-3xl mx-auto px-4 py-10">
                <div className="bg-white p-6 md:p-8 rounded-2xl border border-slate-200 shadow-md space-y-6">
                  <div className="border-b pb-4">
                    <h2 className="text-2xl font-bold text-slate-900">User Registration</h2>
                    <p className="text-xs text-slate-500">Kripya apni sahi details bharein. Ye aapke profile me save hone vali hain.</p>
                  </div>

                  <form onSubmit={handleUserRegister} className="space-y-6">
                    {/* Primary User Information */}
                    <div className="grid grid-cols-1 sm:grid-cols-2 gap-4">
                      <div>
                        <label className="text-xs font-bold block mb-1 text-slate-700">Full Name</label>
                        <input required type="text" placeholder="Rahul Sharma" value={regForm.name} onChange={e => setRegForm({...regForm, name: e.target.value})} className="w-full border border-slate-300 p-2.5 rounded-xl text-sm focus:outline-none focus:border-blue-600" />
                      </div>
                      <div>
                        <label className="text-xs font-bold block mb-1 text-slate-700">Mobile Number</label>
                        <input required type="tel" placeholder="9876543210" value={regForm.phone} onChange={e => setRegForm({...regForm, phone: e.target.value})} className="w-full border border-slate-300 p-2.5 rounded-xl text-sm focus:outline-none focus:border-blue-600" />
                      </div>
                      <div>
                        <label className="text-xs font-bold block mb-1 text-slate-700">Email ID</label>
                        <input required type="email" placeholder="rahul@example.com" value={regForm.email} onChange={e => setRegForm({...regForm, email: e.target.value})} className="w-full border border-slate-300 p-2.5 rounded-xl text-sm focus:outline-none focus:border-blue-600" />
                      </div>
                      <div>
                        <label className="text-xs font-bold block mb-1 text-slate-700">Password</label>
                        <input required type="password" placeholder="••••••••" value={regForm.password} onChange={e => setRegForm({...regForm, password: e.target.value})} className="w-full border border-slate-300 p-2.5 rounded-xl text-sm focus:outline-none focus:border-blue-600" />
                      </div>
                    </div>

                    {/* Sequential Education Details Table (Qualification, Percentage, Passout, Institute) */}
                    <div>
                      <div className="flex justify-between items-center mb-2">
                        <label className="text-xs font-bold text-slate-800">Education Details (Kramanushar)</label>
                        <button type="button" onClick={addRegEduRow} className="text-xs bg-blue-50 text-blue-600 font-bold px-3 py-1 rounded-lg border border-blue-200 hover:bg-blue-100">+ Add Row</button>
                      </div>
                      <div className="overflow-x-auto border border-slate-200 rounded-xl">
                        <table className="w-full text-left text-xs border-collapse">
                          <thead>
                            <tr className="bg-slate-100 border-b border-slate-200 text-slate-700 font-bold">
                              <th className="p-2.5 border-r">Qualification</th>
                              <th className="p-2.5 border-r">Percentage</th>
                              <th className="p-2.5 border-r">Passing Year</th>
                              <th className="p-2.5 border-r">Institute Name</th>
                              <th className="p-2.5 text-center">Action</th>
                            </tr>
                          </thead>
                          <tbody>
                            {regForm.education.map((row, idx) => (
                              <tr key={idx} className="border-b border-slate-100">
                                <td className="p-1.5 border-r"><input type="text" placeholder="10th / B.Tech" value={row.qualification} onChange={e => { const updated = [...regForm.education]; updated[idx].qualification = e.target.value; setRegForm({...regForm, education: updated}); }} className="w-full p-1.5 border border-slate-200 rounded text-xs" /></td>

                        <div>
                          <label className="text-xs font-bold block mb-1 text-slate-700">Website Name</label>
                          <input type="text" value={siteConfig.siteName} onChange={e => setSiteConfig({...siteConfig, siteName: e.target.value})} className="w-full border p-2 rounded-lg text-sm" />
                        </div>
                        <div>
                          <label className="text-xs font-bold block mb-1 text-slate-700">Website Subtitle</label>
                          <input type="text" value={siteConfig.subtitle} onChange={e => setSiteConfig({...siteConfig, subtitle: e.target.value})} className="w-full border p-2 rounded-lg text-sm" />
                        </div>
                      </div>

                      {/* Custom Coding Injection Widget for New Features */}
                      <div className="bg-white p-6 rounded-2xl border border-slate-200 shadow-sm space-y-3">
                        <h3 className="font-bold text-slate-800 border-b pb-2 flex items-center gap-2">
                          <i className="fa-solid fa-code text-purple-600"></i> Custom Code Injection Widget
                        </h3>
                        <p className="text-xs text-slate-500">Website me naya feature dalne ke liye yahan custom code paste karein:</p>
                        <textarea rows="3" value={siteConfig.customCode} onChange={e => setSiteConfig({...siteConfig, customCode: e.target.value})} className="w-full border p-2 rounded-lg text-xs font-mono" placeholder="<!-- Custom Script/Style Here -->"></textarea>
                      </div>

                      {/* Create New Widget Option */}
                      <div className="bg-white p-6 rounded-2xl border border-slate-200 shadow-sm space-y-3">
                        <h3 className="font-bold text-slate-800 border-b pb-2 flex items-center gap-2">
                          <i className="fa-solid fa-plus-circle text-orange-600"></i> Create New Widget
                        </h3>
                        <input id="new-widget-name" type="text" placeholder="Widget Title" className="w-full border p-2 rounded-lg text-xs" />
                        <textarea id="new-widget-code" rows="2" placeholder="Widget Content / Code" className="w-full border p-2 rounded-lg text-xs font-mono"></textarea>
                        <button onClick={() => {
                          const name = document.getElementById('new-widget-name').value;
                          const code = document.getElementById('new-widget-code').value;
                          if (name) {
                            setAdminWidgets([...adminWidgets, { id: Date.now(), name, code }]);
                            alert('Naya Widget successfully create ho gaya!');
                          }
                        }} className="bg-slate-900 text-white font-bold text-xs px-4 py-2 rounded-lg">
                          Create Widget
                        </button>
                      </div>
                    </div>

                    {/* Admin Users Registration and Management */}
                    <div className="bg-white p-6 rounded-2xl border border-slate-200 shadow-sm space-y-4">
                      <div className="flex justify-between items-center border-b pb-2">
                        <h3 className="font-bold text-slate-800">Admin Account Management</h3>
                        <button onClick={() => {
                          const email = prompt("Enter New Admin Email:");
                          const password = prompt("Enter New Admin Password:");
                          if (email && password) setAdmins([...admins, { id: Date.now(), email, password }]);
                        }} className="text-xs bg-blue-600 text-white font-bold px-3 py-1.5 rounded-lg">+ Add Admin Account</button>
                      </div>
                      <div className="overflow-x-auto">
                        <table className="w-full text-left text-xs border-collapse">
                          <thead>
                            <tr className="border-b border-slate-200 text-slate-500 font-bold">
                              <th className="py-2">Admin Email / ID</th>
                              <th className="py-2">Password</th>
                              <th className="py-2">Action</th>
                            </tr>
                          </thead>
                          <tbody>
                            {admins.map(a => (
                              <tr key={a.id} className="border-b border-slate-100">
                                <td className="py-2.5 font-semibold text-slate-800">{a.email}</td>
                                <td className="py-2.5 font-mono text-slate-500">{a.password}</td>
                                <td className="py-2.5 space-x-2">
                                  <button onClick={() => {
                                    const newPass = prompt("Update Password for " + a.email, a.password);
                                    if (newPass) setAdmins(admins.map(item => item.id === a.id ? {...item, password: newPass} : item));
                                  }} className="text-blue-600 font-bold hover:underline">Update</button>
                                  {admins.length > 1 && (
                                    <button onClick={() => setAdmins(admins.filter(item => item.id !== a.id))} className="text-red-600 font-bold hover:underline">Delete</button>
                                  )}
                                </td>
                              </tr>
                            ))}
                          </tbody>
                        </table>
                      </div>
                    </div>

                    {/* User Data Table (Name, Email, Phone, Password & Delete Options) */}
                    <div className="bg-white p-6 rounded-2xl border border-slate-200 shadow-sm space-y-4">
                      <h3 className="font-bold text-slate-800 border-b pb-2">Registered User Database</h3>
                      <div className="overflow-x-auto">
                        <table className="w-full text-left text-xs border-collapse">
                          <thead>
                            <tr className="border-b border-slate-200 text-slate-500 font-bold">
                              <th className="py-2">User Name</th>
                              <th className="py-2">Email ID</th>
                              <th className="py-2">Phone Number</th>
                              <th className="py-2">Password</th>
                              <th className="py-2">Action</th>
                            </tr>
                          </thead>
                          <tbody>
                            {users.map(u => (
                              <tr key={u.id} className="border-b border-slate-100">
                                <td className="py-2.5 font-semibold text-slate-900">{u.name}</td>
                                <td className="py-2.5 text-slate-600">{u.email}</td>
                                <td className="py-2.5 text-slate-600">{u.phone}</td>
                                <td className="py-2.5 font-mono text-slate-500">{u.password}</td>
                                <td className="py-2.5">
                                  <button onClick={() => setUsers(users.filter(usr => usr.id !== u.id))} className="text-red-600 font-bold hover:underline">
                                    Delete / Remove User
                                  </button>
                                </td>
                              </tr>
                            ))}
                          </tbody>
                        </table>
                      </div>
                    </div>

                  </div>
                )}
              </div>
            )}

            {/* 7. ALL 50 TEMPLATES CATALOG MODAL */}
            {show50TemplatesModal && (
              <div className="fixed inset-0 bg-slate-900/60 backdrop-blur-sm z-50 flex items-center justify-center p-4">
                <div className="bg-white rounded-2xl max-w-5xl w-full max-h-[85vh] p-6 overflow-y-auto space-y-4">
                  <div className="flex justify-between items-center border-b pb-3">
                    <h3 className="text-lg font-bold text-slate-900">Choose From All 50 Resume Formats</h3>
                    <button onClick={() => setShow50TemplatesModal(false)} className="text-slate-400 font-bold hover:text-slate-800 text-lg">✕</button>
                  </div>
                  <div className="grid grid-cols-2 md:grid-cols-5 gap-3">
                    {templatesList.map(tpl => (
                      <div 
                        key={tpl.id}
                        onClick={() => { setResumeForm({...resumeForm, templateId: tpl.id}); setShow50TemplatesModal(false); setCurrentPage('editor'); }}
                        className={`border-2 ${tpl.color} rounded-xl p-3 text-center cursor-pointer hover:scale-105 transition`}
                      >
                        <div className="h-20 border border-dashed border-slate-300 rounded bg-white mb-2 flex items-center justify-center text-[10px] text-slate-400 font-bold">Layout Preview</div>
                        <p className="text-xs font-bold text-slate-800">{tpl.title}</p>
                      </div>
                    ))}
                  </div>
                </div>
              </div>
            )}

          </main>
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
