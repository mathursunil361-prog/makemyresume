<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MakeMyResume - Admin Control Panel</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>body { font-family: 'Plus Jakarta Sans', sans-serif; background-color: #f1f5f9; color: #0f172a; }</style>
</head>
<body class="min-h-screen flex flex-col">

    <!-- ADMIN NAVBAR -->
    <header class="bg-slate-900 text-white px-6 py-4 flex justify-between items-center sticky top-0 z-50">
        <div class="flex items-center gap-3">
            <div class="w-8 h-8 bg-red-600 rounded-lg flex items-center font-bold justify-center">A</div>
            <h1 class="font-black text-sm uppercase tracking-wider">Admin Control Panel</h1>
        </div>
        <button onclick="window.location.href='index.html'" class="bg-slate-800 hover:bg-slate-700 text-xs font-bold px-4 py-2 rounded-xl transition">
            <i class="fa-solid fa-house"></i> Exit to Website
        </button>
    </header>

    <!-- ADMIN MAIN CONTENT -->
    <main class="flex-1 max-w-7xl w-full mx-auto p-6 space-y-8">
        
        <!-- STATS & WIDGETS SECTION -->
        <div class="grid grid-cols-1 md:grid-cols-3 gap-6">
            
            <!-- Widget 1: Payment Gateway Settings -->
            <div class="bg-white p-6 rounded-3xl border border-slate-200 shadow-sm space-y-4">
                <h3 class="text-xs font-extrabold uppercase text-slate-400 tracking-wider flex items-center gap-2">
                    <i class="fa-solid fa-credit-card text-red-600"></i> Payment Gateway Widget
                </h3>
                <div>
                    <label class="block text-xs font-bold text-slate-700 mb-1">Razorpay Key ID</label>
                    <input type="text" id="adminRzpKey" class="w-full bg-slate-50 border border-slate-200 p-2.5 rounded-xl text-xs">
                </div>
                <div>
                    <label class="block text-xs font-bold text-slate-700 mb-1">Custom Price for Clean PDF (₹)</label>
                    <input type="number" id="adminCustomPrice" class="w-full bg-slate-50 border border-slate-200 p-2.5 rounded-xl text-xs">
                </div>
                <button onclick="savePaymentSettings()" class="w-full bg-slate-900 hover:bg-slate-800 text-white text-xs font-bold py-2.5 rounded-xl transition">Save Payment Settings</button>
            </div>

            <!-- Widget 2: Launch New Template -->
            <div class="bg-white p-6 rounded-3xl border border-slate-200 shadow-sm space-y-4">
                <h3 class="text-xs font-extrabold uppercase text-slate-400 tracking-wider flex items-center gap-2">
                    <i class="fa-solid fa-layer-group text-blue-600"></i> Launch New Template
                </h3>
                <div>
                    <label class="block text-xs font-bold text-slate-700 mb-1">Template Title / Name</label>
                    <input type="text" id="newTemplateTitle" placeholder="e.g. Executive Corporate" class="w-full bg-slate-50 border border-slate-200 p-2.5 rounded-xl text-xs">
                </div>
                <div>
                    <label class="block text-xs font-bold text-slate-700 mb-1">Template HTML Code / Layout</label>
                    <input type="text" id="newTemplateCode" placeholder="Template ID or layout URL" class="w-full bg-slate-50 border border-slate-200 p-2.5 rounded-xl text-xs">
                </div>
                <button onclick="launchTemplate()" class="w-full bg-blue-600 hover:bg-blue-700 text-white text-xs font-bold py-2.5 rounded-xl transition">Launch Template</button>
            </div>

            <!-- Widget 3: Global Typography Settings -->
            <div class="bg-white p-6 rounded-3xl border border-slate-200 shadow-sm space-y-3">
                <h3 class="text-xs font-extrabold uppercase text-slate-400 tracking-wider flex items-center gap-2">
                    <i class="fa-solid fa-font text-emerald-600"></i> Global Typography & Style
                </h3>
                <div class="grid grid-cols-2 gap-2 text-xs">
                    <div>
                        <label class="block font-bold text-slate-600 mb-1">Heading Color</label>
                        <input type="color" id="admHeadColor" value="#0f172a" class="w-full h-8 border rounded cursor-pointer">
                    </div>
                    <div>
                        <label class="block font-bold text-slate-600 mb-1">Paragraph Color</label>
                        <input type="color" id="admSubColor" value="#475569" class="w-full h-8 border rounded cursor-pointer">
                    </div>
                </div>
                <div class="grid grid-cols-2 gap-2 text-xs">
                    <div>
                        <label class="block font-bold text-slate-600 mb-1">Head Size (px)</label>
                        <input type="number" id="admHeadSize" value="14" class="w-full bg-slate-50 border p-2 rounded-xl">
                    </div>
                    <div>
                        <label class="block font-bold text-slate-600 mb-1">Font Family</label>
                        <select id="admFontFamily" class="w-full bg-slate-50 border p-2 rounded-xl text-xs">
                            <option value="'Plus Jakarta Sans', sans-serif">Jakarta Sans</option>
                            <option value="'Roboto', sans-serif">Roboto</option>
                            <option value="'Merriweather', serif">Merriweather</option>
                        </select>
                    </div>
                </div>
                <div class="flex gap-2 text-xs pt-1">
                    <label><input type="checkbox" id="admBold"> Bold</label>
                    <label><input type="checkbox" id="admItalic"> Italic</label>
                    <label><input type="checkbox" id="admUnderline"> Underline</label>
                </div>
                <button onclick="saveGlobalStyling()" class="w-full bg-emerald-600 hover:bg-emerald-700 text-white text-xs font-bold py-2.5 rounded-xl transition">Apply to All Templates</button>
            </div>
        </div>

        <!-- USERS MANAGEMENT TABLE -->
        <div class="bg-white p-6 rounded-3xl border border-slate-200 shadow-sm space-y-4">
            <h3 class="text-xs font-extrabold uppercase text-slate-400 tracking-wider">Registered Users & Profiles Data</h3>
            <div class="overflow-x-auto">
                <table class="w-full text-left text-xs">
                    <thead class="bg-slate-50 border-b text-slate-400 uppercase font-bold">
                        <tr>
                            <th class="p-3">Name</th>
                            <th class="p-3">Email & Phone</th>
                            <th class="p-3">Education / Experience</th>
                            <th class="p-3">Status</th>
                            <th class="p-3 text-right">Action</th>
                        </tr>
                    </thead>
                    <tbody id="adminUsersTableBody" class="divide-y divide-slate-100">
                        <!-- Populated by JS -->
                    </tbody>
                </table>
            </div>
        </div>
    </main>

    <!-- ADMIN SCRIPT -->
    <script>
        document.addEventListener("DOMContentLoaded", () => {
            loadAdminSettings();
            renderUsersTable();
        });

        function loadAdminSettings() {
            document.getElementById('adminRzpKey').value = localStorage.getItem('admin_rzp_key') || 'rzp_test_key';
            document.getElementById('adminCustomPrice').value = localStorage.getItem('admin_custom_price') || '100';
        }

        function savePaymentSettings() {
            localStorage.setItem('admin_rzp_key', document.getElementById('adminRzpKey').value);
            localStorage.setItem('admin_custom_price', document.getElementById('adminCustomPrice').value);
            alert("Payment gateway settings updated successfully!");
        }

        function launchTemplate() {
            const title = document.getElementById('newTemplateTitle').value;
            if(!title) { alert("Enter template title!"); return; }
            alert(`New professional template "${title}" successfully launched and added to templates collection!`);
        }

        function saveGlobalStyling() {
            const settings = {
                headColor: document.getElementById('admHeadColor').value,
                subColor: document.getElementById('admSubColor').value,
                headSize: document.getElementById('admHeadSize').value,
                fontFamily: document.getElementById('admFontFamily').value,
                isBold: document.getElementById('admBold').checked,
                isItalic: document.getElementById('admItalic').checked,
                isUnderline: document.getElementById('admUnderline').checked
            };
            localStorage.setItem('admin_global_styling', JSON.stringify(settings));
            alert("Global typography settings saved and applied to all resume templates!");
        }

        function renderUsersTable() {
            const tbody = document.getElementById('adminUsersTableBody');
            let users = JSON.parse(localStorage.getItem('app_users') || '[]');
            tbody.innerHTML = '';

            if(users.length === 0) {
                tbody.innerHTML = `<tr><td colspan="5" class="p-4 text-center text-slate-400">No registered users found yet.</td></tr>`;
                return;
            }

            users.forEach((u, index) => {
                tbody.innerHTML += `
                    <tr class="hover:bg-slate-50">
                        <td class="p-3 font-bold text-slate-900">${u.name}</td>
                        <td class="p-3 text-slate-600">${u.email}<br><span class="text-[10px] text-slate-400">${u.phone}</span></td>
                        <td class="p-3 text-slate-600">${u.grad || 'N/A'}<br><span class="text-[10px] text-slate-400">${u.company || 'Fresher'}</span></td>
                        <td class="p-3"><span class="px-2 py-0.5 rounded text-[10px] font-bold ${u.paid ? 'bg-emerald-100 text-emerald-700' : 'bg-amber-100 text-amber-700'}">${u.paid ? 'Pro Paid' : 'Free Watermark'}</span></td>
                        <td class="p-3 text-right">
                            <button onclick="deleteUser(${index})" class="bg-red-50 hover:bg-red-100 text-red-600 px-2.5 py-1 rounded-lg font-bold transition">Delete</button>
                        </td>
                    </tr>
                `;
            });
        }

        function deleteUser(index) {
            if(confirm("Are you sure you want to delete this user profile?")) {
                let users = JSON.parse(localStorage.getItem('app_users') || '[]');
                users.splice(index, 1);
                localStorage.setItem('app_users', JSON.stringify(users));
                renderUsersTable();
            }
        }
    </script>
</body>
</html>
